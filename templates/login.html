<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Vexa-AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0} body{min-height:100vh;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#1e293b,#020617 55%);color:#e5e7eb;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:420px;background:rgba(15,23,42,.82);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.35);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;font-weight:800}.brand h1{font-size:24px}.muted{color:#94a3b8;margin:6px 0 24px}.field{margin-bottom:16px}label{font-size:13px;color:#cbd5e1;display:block;margin-bottom:8px}input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:#020617;color:#e5e7eb;outline:none}input:focus{border-color:#3b82f6;box-shadow:0 0 0 4px rgba(59,130,246,.12)}button{width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;font-weight:700;cursor:pointer;margin-top:8px}.link{margin-top:18px;text-align:center;color:#94a3b8}.link a{color:#60a5fa;text-decoration:none}.msg{padding:10px 12px;border-radius:12px;margin-bottom:14px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#fecaca}.success{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.25);color:#bbf7d0}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="logo">V</div><div><h1>Vexa-AI</h1><p class="muted">Sign in to continue</p></div></div>
    {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="msg {{ 'success' if category == 'success' else '' }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
    <form method="POST" action="/login">
      <div class="field"><label>Username or Email</label><input name="identifier" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div>
      <button type="submit">Login</button>
    </form>
    <p class="link">New user? <a href="/register">Create account</a></p>
  </main>
</body>
</html>
